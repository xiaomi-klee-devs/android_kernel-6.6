name: Build and publish Kernel

on:
  push:
    branches:
      - bsp-klee-w-oss
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set environment
      run: |
        echo "DATE=$(TZ=Asia/Jakarta date +%Y%m%d%H%M)" >> $GITHUB_ENV
        echo "ARTIFACT=$GITHUB_WORKSPACE/artifact" >> $GITHUB_ENV

    - name: Building
      run: |
        sudo apt-get update -y && sudo apt-get install -y device-tree-compiler
        mkdir -p "${{ env.ARTIFACT }}"
        chmod +x compile.sh && ./compile.sh NoKSU "${{ env.DATE }}" "${{ env.ARTIFACT }}"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rethinking-NoKSU-${{ env.DATE }}
        path: ${{ env.ARTIFACT }}/*
